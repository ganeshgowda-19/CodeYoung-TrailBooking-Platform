<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Cyan to Royal Blue Ribbon Gradient */}
    <linearGradient id="logo-cyan-blue" x1="120" y1="40" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    {/* Blue to Purple Diagonal Twist Gradient */}
    <linearGradient id="logo-blue-purple" x1="100" y1="200" x2="420" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    {/* Orange Gold Accent Block Gradient */}
    <linearGradient id="logo-orange-gold" x1="300" y1="180" x2="440" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    {/* Bottom Purple Magenta Base Gradient */}
    <linearGradient id="logo-magenta-red" x1="140" y1="340" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    {/* Soft Ambient Shadow Filter */}
    <filter id="logo-drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#logo-drop-shadow)">
    {/* 1. Top Right Warm Orange/Gold Back Layer */}
    <rect x="290" y="170" width="150" height="250" rx="36" fill="url(#logo-orange-gold)" />

    {/* 2. Top-Left Vertical Cyan-Blue Loop */}
    <path d="M 170 30 
             L 280 30 
             C 300 30, 310 45, 295 75 
             L 160 320 
             C 145 350, 120 350, 95 320 
             L 70 270 
             C 55 240, 65 210, 90 160 
             Z" 
          fill="url(#logo-cyan-blue)" />

    {/* 3. Middle Diagonal Overlapping Ribbon (Blue to Magenta Ribbon) */}
    <path d="M 75 280 
             L 300 30 
             C 315 15, 335 15, 345 35 
             L 420 180 
             C 435 210, 425 240, 390 260 
             L 140 375 
             C 105 390, 85 370, 75 340 
             Z" 
          fill="url(#logo-blue-purple)" />

    {/* 4. Bottom Horizontal Purple/Magenta Rounded Base Layer */}
    <rect x="130" y="345" width="310" height="115" rx="36" fill="url(#logo-magenta-red)" />
  </g>
</svg>
