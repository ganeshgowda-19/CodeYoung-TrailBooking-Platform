version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trialflow-postgres
    restart: always
    environment:
      POSTGRES_USER: trialflow_user
      POSTGRES_PASSWORD: trialflow_pass
      POSTGRES_DB: trialflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialflow_user -d trialflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
